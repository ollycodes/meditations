# Deploy the static export: plain files from `out/`, no server functions.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Pin Node so a future rebuild doesn't break when Netlify's default changes.
  NODE_VERSION = "22"

# Hashed build assets never change, so browsers can cache them for good.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must always be re-checked so updates reach users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
